# Continuous integration of GNX-py: install the package with Python 3.12 on Linux, macOS and Windows, import it
# outside the source tree (the installed copy and its version metadata), and run the SPP example (its default
# one-hour GPS + Galileo + BeiDou run) on the repository's sample data.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  install:
    name: install, import, SPP example (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      NUMBA_NUM_THREADS: "2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install GNX-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Import the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import os, tomllib, gnx_py; v = tomllib.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'], 'pyproject.toml'), 'rb'))['project']['version']; assert gnx_py.__version__ == v, (gnx_py.__version__, v); print('gnx_py', gnx_py.__version__, gnx_py.__file__)"

      - name: SPP example on sample_data (one hour)
        run: python examples/run_spp_example.py
